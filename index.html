<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Belajar Digital — UPT SMAN 26 Bone</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/115w1UQqLJ45JRxf1MvkvzzybvFO9XHLM" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root { --navy: #0F172A; --gold: #F59E0B; --cyan: #06B6D4; }
    html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background: #F1F5F9; color: #1E293B; }
    .login-wrapper { min-height: 100vh; width: 100%; background: linear-gradient(135deg, #0F172A 0%, #1E293B 60%, #0E7490 100%); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card { background: #FFFFFF; border-radius: 1.25rem; max-width: 410px; width: 100%; padding: 2.2rem 1.85rem; box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38); border-top: 5px solid var(--gold); }
    .logo-login { width: 86px; height: 86px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.25)); }
    .navbar-portal { background-color: var(--navy); border-bottom: 3px solid var(--gold); }
    .logo-nav { width: 38px; height: 38px; object-fit: contain; }
    .btn-navy { background-color: var(--navy); color: #FFFFFF; border: none; }
    .btn-navy:hover { background-color: #1E293B; color: #FFFFFF; }
    .badge-lencana { background: linear-gradient(135deg, #F59E0B, #D97706); color: #FFF; font-weight: 600; padding: 0.45rem 0.9rem; border-radius: 2rem; font-size: 0.85rem; }
    .simulasi-frame { width: 100%; height: 450px; border: none; border-radius: 0.75rem; background: #000; }
  </style>
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-3">
        <img src="https://lh3.googleusercontent.com/d/115w1UQqLJ45JRxf1MvkvzzybvFO9XHLM" alt="Logo UPT SMAN 26 Bone" class="logo-login mb-2" />
        <div class="fw-bold text-uppercase small" style="color: #D97706; letter-spacing: 1px;">UPT SMA NEGERI 26 BONE</div>
        <h4 class="fw-bold mb-1" style="color: #0F172A;">Portal Belajar Digital</h4>
        <p class="text-muted small mb-0">Masuk menggunakan NIS 7 digit kalian</p>
      </div>

      <div class="mt-3">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Username / NIS (7 Digit)</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
            <input type="text" id="inputUser" class="form-control" placeholder="Contoh: 2026001" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">PIN Akses (7 Digit)</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
            <input type="password" id="inputPin" class="form-control" placeholder="Masukkan NIS 7 digit" />
            <button class="btn btn-outline-secondary" type="button" onclick="togglePin()"><i id="iconMata" class="bi bi-eye"></i></button>
          </div>
        </div>
        <div id="loginAlert" class="alert alert-danger py-2 small d-none"></div>
        <button type="button" id="btnLogin" onclick="prosesLogin()" class="btn btn-navy w-100 py-2 fw-bold rounded-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Kelas
        </button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="dashboardSection" class="d-none">
    <nav class="navbar navbar-dark navbar-portal sticky-top px-3 py-2">
      <div class="container-fluid">
        <div class="d-flex align-items-center
		<!-- MODAL AKTIVITAS -->
  <div class="modal fade" id="modalAktivitas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-dark text-white">
          <h6 class="modal-title fw-bold" id="modalTitle">Judul Aktivitas</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx7BY02VykL5vOUWtBxnyGSYVWptOQiP2ph84Vv9Myz8Ge3memFEGCF8kQgNgnJ2wtybw/exec";
    let currentUser = null;
    let appData = { kursus: [], materi: [], soal: [], nilai: [], tugas: [] };
    const modalObj = new bootstrap.Modal(document.getElementById("modalAktivitas"));

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("portal_sman26_user");
      if (saved) {
        currentUser = JSON.parse(saved);
        tampilkanDashboard();
      }
      document.getElementById("inputPin").addEventListener("keypress", (e) => {
        if (e.key === "Enter") prosesLogin();
      });
    });

    function togglePin() {
      const inp = document.getElementById("inputPin");
      const icon = document.getElementById("iconMata");
      if (inp.type === "password") {
        inp.type = "text";
        icon.className = "bi bi-eye-slash";
      } else {
        inp.type = "password";
        icon.className = "bi bi-eye";
      }
    }

    async function prosesLogin() {
      const username = document.getElementById("inputUser").value.trim();
      const pin = document.getElementById("inputPin").value.trim();
      const btn = document.getElementById("btnLogin");
      const alertBox = document.getElementById("loginAlert");

      if (!username || !pin) {
        alertBox.textContent = "Harap isi Username/NIS dan PIN terlebih dahulu!";
        alertBox.classList.remove("d-none");
        return;
      }

      alertBox.classList.add("d-none");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa akun...';

      try {
        const res = await fetch(`${API_URL}?action=login&username=${encodeURIComponent(username)}&pin=${encodeURIComponent(pin)}`);
        const json = await res.json();

        if (json.status === "success" && json.user) {
          currentUser = json.user;
          localStorage.setItem("portal_sman26_user", JSON.stringify(currentUser));
          tampilkanDashboard();
        } else {
          alertBox.textContent = json.message || "Username atau PIN tidak cocok. Pastikan memakai NIS 7 digit!";
          alertBox.classList.remove("d-none");
        }
      } catch (err) {
        alertBox.textContent = "Gagal terhubung ke server Apps Script. Pastikan izin akses Web App sudah 'Siapa saja (Anyone)'.";
        alertBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Kelas';
      }
    }

    function logout() {
      localStorage.removeItem("portal_sman26_user");
      currentUser = null;
      document.getElementById("dashboardSection").classList.add("d-none");
      document.getElementById("loginSection").classList.remove("d-none");
    }

    function tampilkanDashboard() {
      document.getElementById("loginSection").classList.add("d-none");
      document.getElementById("dashboardSection").classList.remove("d-none");
      document.getElementById("userNameLabel").textContent = currentUser.nama_lengkap;
      document.getElementById("userKelasLabel").textContent = `Kelas ${currentUser.Kelas || "-"}`;
      document.getElementById("userBadgeNav").textContent = `${currentUser.role.toUpperCase()} • ${currentUser.Kelas || "SMAN 26"}`;

      if (currentUser.role === "guru" || currentUser.role === "admin") {
        document.getElementById("panelGuru").classList.remove("d-none");
      } else {
        document.getElementById("panelGuru").classList.add("d-none");
      }
      muatDataDashboard();
    }

    function cocokKelas(kelasKursus, kelasSiswa) {
      if (!kelasKursus || currentUser.role === "guru" || currentUser.role === "admin") return true;
      const k = String(kelasKursus).trim().toUpperCase();
      const s = String(kelasSiswa || "").trim().toUpperCase();
      if (k === "ALL" || k === "SEMUA" || k === s) return true;
      if (k === "XII" && s.startsWith("XII")) return true;
      if (k === "XI" && s.startsWith("XI") && !s.startsWith("XII")) return true;
      if (k === "X" && s.startsWith("X") && !s.startsWith("XI")) return true;
      return false;
    }

    async function muatDataDashboard() {
      const container = document.getElementById("kursusContainer");
      container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted small">Memuat materi pembelajaran...</p></div>';

      try {
        const res = await fetch(`${API_URL}?action=getDashboard&user_id=${encodeURIComponent(currentUser.user_id)}`);
        const json = await res.json();
        appData = {
          kursus: json.kursus || [],
          materi: json.materi || [],
          soal: json.soal || [],
          nilai: json.nilai || [],
          tugas: json.tugas || []
        };
        renderKursus();
        if (currentUser.
